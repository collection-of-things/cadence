<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
:root{
  /* one motion language: quick ease-out for state changes, one spring for sheets */
  --eo:cubic-bezier(.23,1,.32,1);
  --io:cubic-bezier(.77,0,.175,1);
  --drawer:cubic-bezier(.32,.72,0,1);
  --icon:cubic-bezier(.2,0,0,1);
  --spring:linear(0,0.047,0.156,0.292,0.433,0.565,0.682,0.778,0.855,0.914,0.956,0.985,1.004,1.015,1.021,1.022,1.021,1.019,1.016,1.013,1.01,1.007,1.005,1.003,1.002,1.001,1);
  --t1:rgba(255,255,255,.96);
  --t2:rgba(255,255,255,.70);
  --t3:rgba(255,255,255,.56);
  --t4:rgba(255,255,255,.36);
  --hair:rgba(255,255,255,.08);
  --accent:#ff7a45;
  --on-accent:#140903;
  --tint:rgba(58,18,10,.9);
  --sbw:244px;
  --gap:12px;
  --glass:rgba(17,16,21,.58);
  --glass-strong:rgba(15,14,19,.93);
  --elev:0 0 0 1px rgba(255,255,255,.075),inset 0 1px 0 rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.24),0 12px 32px -10px rgba(0,0,0,.5),0 40px 90px -28px rgba(0,0,0,.6);
  --elev-sm:0 0 0 1px rgba(255,255,255,.065),0 1px 2px rgba(0,0,0,.3),0 8px 20px -8px rgba(0,0,0,.5);
}
@media (max-height:840px){.sr2{min-height:34px;padding:3px 10px}.sh{margin-top:10px}.sl{height:27px}}
@media (max-width:1360px){:root{--sbw:224px}}
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html,body{height:100%}
body{background:#08070a;color:var(--t1);overflow:hidden;user-select:none;
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;
  font-optical-sizing:auto;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:1px solid transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
img{display:block;-webkit-user-drag:none}
ol,ul{list-style:none}
h1,h2,h3{text-wrap:balance}
button:focus-visible,[tabindex]:focus-visible,[role=slider]:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px;border-radius:8px}
.num,.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{position:relative}
.ring::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);pointer-events:none}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--c,#888);flex:none;box-shadow:0 0 0 2.5px color-mix(in srgb,var(--c,#888) 20%,transparent)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.ic.f{fill:currentColor;stroke:none}
.crop{scale:1.16}
.kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:6px;font:600 10.5px/1 'Inter',sans-serif;color:var(--t2);letter-spacing:.02em;
  background:rgba(255,255,255,.09);box-shadow:inset 0 -1px 0 rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.05);white-space:nowrap}
.pr{transition:transform 150ms var(--eo)}
.pr:not(:disabled):active{transform:scale(.96)}
.ib{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--t2);flex:none;
  transition:transform 150ms var(--eo),background-color 120ms ease,color 120ms ease,opacity 120ms ease}
.ib:not(:disabled):active{transform:scale(.96)}
.ib.on{color:var(--accent)}
#player .ib.on::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.ib .badge{position:absolute;right:6px;top:7px;font-size:8.5px;font-weight:800;line-height:1;opacity:0;transform:scale(.6);transition:opacity 140ms ease,transform 140ms var(--eo)}
.ib.one .badge{opacity:1;transform:none}
@media (hover:hover) and (pointer:fine){
  .ib:hover{background-color:rgba(255,255,255,.09);color:#fff}
  .ib.on:hover{color:var(--accent)}
}

/* ================= ambient ================= */
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#fb{position:fixed;inset:0;z-index:0;display:none;overflow:hidden;background:#0a090d}
.nogl #gl{display:none}.nogl #fb{display:block}
.fbx{position:absolute;inset:-18%;opacity:0;transition:opacity 1200ms ease;animation:fbd 48s ease-in-out infinite alternate}
.fbx.on{opacity:1}
@keyframes fbd{from{transform:rotate(0deg) scale(1)}to{transform:rotate(12deg) scale(1.1)}}
/* legibility scrim: one fixed veil; ambient stays alive but never fights text */
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 300ms var(--eo);
  background:
   linear-gradient(180deg,rgba(7,7,10,.5) 0,rgba(7,7,10,.34) 90px,rgba(7,7,10,.30) 45%,rgba(7,7,10,.62) 100%),
   radial-gradient(120% 90% at 78% 8%,rgba(7,7,10,.06),rgba(7,7,10,.5) 78%),
   linear-gradient(90deg,rgba(7,7,10,.34),rgba(7,7,10,.1) 34%,rgba(7,7,10,.1) 72%,rgba(7,7,10,.32));}
.np-open #veil{opacity:.5}
/* now playing takes over the window: shell chrome steps back */
.np-open #side,.np-open #top,.np-open #main,.np-open #queue{opacity:0;pointer-events:none;transition:opacity 180ms var(--eo)}
#side,#top,#main,#queue{transition:opacity 220ms var(--eo)}
#np::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,6,9,.5) 0,rgba(6,6,9,.12) 96px,rgba(6,6,9,.1) 58%,rgba(6,6,9,.68) 100%)}

/* ================= shell ================= */
#side{position:fixed;left:12px;top:12px;bottom:12px;width:var(--sbw);z-index:6;display:flex;flex-direction:column;border-radius:20px;padding:8px;
  background:var(--glass);backdrop-filter:blur(44px) saturate(1.6);-webkit-backdrop-filter:blur(44px) saturate(1.6);box-shadow:var(--elev)}
#sideScroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;margin:0 -8px;padding:0 8px 96px}
#sideScroll::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;flex:none}
.mark{width:22px;height:22px;border-radius:7px;flex:none;background:conic-gradient(from 210deg,var(--accent),#fff 42%,var(--accent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 2px 8px -2px rgba(0,0,0,.5)}
.brand b{font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.brand .ver{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--t3);background:rgba(255,255,255,.07);padding:3px 7px;border-radius:6px}
#acct{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:4px 0 2px;border-radius:12px;text-align:left;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);transition:transform 150ms var(--eo),background-color 120ms ease}
#acct:active{transform:scale(.97)}
#acct .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--on-accent);background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#fff))}
#acct .at{min-width:0;flex:1}
#acct .at b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em}
#acct .at span{display:block;font-size:11.5px;color:var(--t3);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acct .dots{display:flex}
#acct .dots i{width:6px;height:6px;border-radius:50%;margin-left:-2px;box-shadow:0 0 0 1.5px rgba(16,15,20,.9)}
@media (hover:hover) and (pointer:fine){#acct:hover{background:rgba(255,255,255,.09)}}
.snav{padding:4px 0 2px}
.sl{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--t2);letter-spacing:-.006em;
  transition:transform 150ms var(--eo),background-color 120ms ease,color 120ms ease}
.sl .ic{width:18px;height:18px}
.sl:active{transform:scale(.97)}
.sl.on{background:rgba(255,255,255,.1);color:#fff}
.sl.on .ic{color:var(--accent)}
.sl small{margin-left:auto;font-size:11px;font-weight:700;color:var(--t3);font-variant-numeric:tabular-nums}
@media (hover:hover) and (pointer:fine){.sl:hover{background-color:rgba(255,255,255,.06);color:#fff}}
.sh{display:flex;align-items:baseline;height:32px;padding:14px 10px 0;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.sh small{margin-left:auto;font-size:10px;letter-spacing:.05em;font-weight:600;color:var(--t4);text-transform:none}
.sr2{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;width:100%;min-height:38px;padding:5px 10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--t2);
  transition:transform 150ms var(--eo),background-color 120ms ease,color 120ms ease}
.sr2:active{transform:scale(.97)}
.sr2 .nm{flex:1 1 calc(100% - 30px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.15}
.sr2 .st{display:block;flex:1 1 100%;margin-left:30px;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sr2 .stx{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--t3);white-space:nowrap;flex:none;text-transform:uppercase}
.sr2.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--pc,transparent)}
@media (hover:hover) and (pointer:fine){.sr2:hover{background-color:rgba(255,255,255,.06);color:#fff}}
.sr2 .st.ok{color:#4ade80}
.sr2 .st.sy{color:#fbbf24}
.pl-art{width:24px;height:24px;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1px;background:#0d0c10;flex:none}
.pl-art img{width:100%;height:100%;object-fit:cover}

/* top chrome */
#top{position:fixed;left:calc(var(--sbw) + 24px);right:0;top:0;height:64px;z-index:6;display:flex;align-items:center;gap:6px;padding:0 18px 0 8px}
.tb-nav{display:flex;gap:2px;margin-right:2px}
.tb-nav .ib{width:32px;height:32px;border-radius:9px}
.tb-nav .ib:disabled{color:var(--t4);opacity:.6}
#crumb{margin-left:8px;font-size:12.5px;font-weight:600;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumb b{color:var(--t2);font-weight:600}
#cmdk{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(380px,30vw);height:36px;border-radius:11px;display:flex;align-items:center;gap:9px;padding:0 7px 0 12px;
  color:var(--t2);font-size:13px;font-weight:500;background:var(--glass);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);
  box-shadow:var(--elev-sm);transition:transform 150ms var(--eo),background-color 120ms ease}
#cmdk:active{transform:translateX(-50%) scale(.97)}
#cmdk .ic{width:16px;height:16px}
#cmdk .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#cmdk .kbd{margin-right:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:2px}
@media (hover:hover) and (pointer:fine){#cmdk:hover{background-color:rgba(255,255,255,.1)}}

/* main */
#main{position:fixed;left:calc(var(--sbw) + 24px);right:0;top:0;bottom:0;z-index:2;overflow:hidden}
#scroller{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;
  transition:opacity 140ms var(--eo),transform 140ms var(--eo);padding:76px 36px 132px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 64px,#000 calc(100% - 96px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 64px,#000 calc(100% - 96px),transparent 100%)}
#scroller.swap{opacity:0;transform:translateY(10px)}
.view{display:none}
.view.on{display:block}
.vin{opacity:0;animation:vin .5s var(--eo) forwards;animation-delay:calc(var(--d,0)*70ms)}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:6px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--t3)}
.eyebrow .sdot{width:6px;height:6px}
.vh h1{font-size:34px;font-weight:800;letter-spacing:-.032em;line-height:1.06;margin-top:10px}
.vh .sub{margin-top:8px;font-size:14px;color:var(--t2);font-weight:500;max-width:560px;text-wrap:pretty}
.v-stats{display:flex;gap:28px;padding-bottom:4px;flex:none}
.v-stats div{text-align:right}
.v-stats b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.v-stats span{display:block;margin-top:2px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}

/* source filter segmented control */

/* sections */
.sec{margin-top:44px}
.sec:first-of-type{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:14px;height:34px;margin-bottom:14px}
.sec-h h2{font-size:20px;font-weight:750;letter-spacing:-.024em}
.sec-h .sub{font-size:12.5px;color:var(--t3);font-weight:500}
.sec-h .lnk{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--t3);border-radius:6px;padding:2px 4px;transition:color 120ms ease}
.sec-h .arr{display:flex;gap:6px}
.sec-h .arr .ib{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.06)}
.sec-h .arr .ib .ic{width:16px;height:16px}
@media (hover:hover) and (pointer:fine){.sec-h .lnk:hover{color:#fff}}

/* jump-back-in tiles */
.jump{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.jt{position:relative;display:flex;align-items:center;gap:13px;height:66px;padding:0 10px 0 8px;border-radius:14px;overflow:hidden;text-align:left;
  background:rgba(255,255,255,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);transition:transform 150ms var(--eo),background-color 140ms ease}
.jt:active{transform:scale(.98)}
.jt img{width:50px;height:50px;border-radius:10px;flex:none;object-fit:cover}
.jt .ta{width:50px;height:50px;border-radius:10px;flex:none;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1px;background:#0d0c10}
.jt .ta img{width:100%;height:100%;border-radius:0}
.jt .jx{flex:1;min-width:0}
.jt .jx b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jt .jx span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jt .jb{position:absolute;left:8px;right:10px;bottom:0;height:2px;background:rgba(255,255,255,.1)}
.jt .jb i{display:block;height:100%;background:rgba(255,255,255,.55);transform-origin:0 50%;transform:scaleX(var(--p))}
.jt .jp{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,7,10,.36);opacity:0;transition:opacity 140ms ease}
.jt .jp .r{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#0c0b0f;box-shadow:0 6px 18px -4px rgba(0,0,0,.6);transform:scale(.7);transition:transform 160ms var(--eo)}
.jt .jp .ic{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){.jt:hover{background:rgba(255,255,255,.1)}.jt:hover .jp{opacity:1}.jt:hover .jp .r{transform:none}}
@media (max-width:1360px){.jump{grid-template-columns:repeat(2,1fr)}}

/* card shelves */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:178px;gap:20px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
  margin:0 -36px;padding:4px 36px 16px;scroll-padding:0 36px}
.shelf::-webkit-scrollbar{display:none}
.card{position:relative;min-width:0;text-align:left;border-radius:14px;transition:transform 180ms var(--eo)}
.card:active{transform:scale(.97)}
.card .ca{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;background:#141318;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -12px rgba(0,0,0,.55);transition:transform 200ms var(--eo)}
.card .ca img{width:100%;height:100%;object-fit:cover}
.mcard .ma img,.pl-art img,.tile .ta img,.pi .pa img,.card .ca img,.ah-art img{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.cell{display:block;overflow:hidden;position:relative;min-width:0;min-height:0}
.cell img{display:block;width:100%;height:100%;object-fit:cover}
.mcard .ma img.crop,.pl-art img.crop,.tile .ta img.crop,.pi .pa img.crop,.ah-art img.crop{scale:1.28}
.card .ca.mos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.card .cb{display:block;margin-top:11px;font-size:13.5px;font-weight:700;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--t3);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs .sdot{width:6px;height:6px}
.card .cplay{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.94);color:#0c0b0f;box-shadow:0 6px 18px -4px rgba(0,0,0,.65);opacity:0;transform:translateY(6px) scale(.8);
  transition:opacity 160ms ease,transform 200ms var(--eo)}
.card .cplay .ic{width:18px;height:18px}
.card .ckind{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;display:inline-flex;align-items:center;border-radius:7px;
  font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(10,9,12,.55);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
@media (hover:hover) and (pointer:fine){
  .card:hover .ca{transform:translateY(-3px)}
  .card:hover .cplay{opacity:1;transform:none}
}
.grid6{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:22px 20px}
.grid6 .card .ca{width:100%}
.card.round .ca{border-radius:50%}
.card.round .ca img{border-radius:50%}

/* mix cards */
.mix{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;scrollbar-width:none;margin:0 -36px;padding:4px 36px 12px}
.mix::-webkit-scrollbar{display:none}
.mcard{position:relative;min-width:0;text-align:left;border-radius:16px;overflow:hidden;padding:10px;transition:transform 180ms var(--eo)}
.mcard:active{transform:scale(.97)}
.mcard .ma{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/10;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1px;background:#0d0c10;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 16px 34px -14px rgba(0,0,0,.6)}
.mcard .ma img{width:100%;height:100%;object-fit:cover}
.mcard .ml{position:absolute;left:10px;bottom:10px;right:60px;padding:7px 10px;border-radius:9px;background:rgba(9,8,11,.55);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.mcard .ml small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--t2)}
.mcard .ml b{display:block;font-size:14px;font-weight:800;letter-spacing:-.015em;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .md{display:flex;align-items:center;gap:6px;margin-top:10px;padding:0 4px;font-size:12px;color:var(--t3);font-weight:500}
.mcard .md span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .cplay{position:absolute;right:18px;top:calc(100% - 88px);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.94);color:#0c0b0f;box-shadow:0 6px 18px -4px rgba(0,0,0,.65);opacity:0;transform:translateY(6px) scale(.8);transition:opacity 160ms ease,transform 200ms var(--eo)}
.mcard .cplay .ic{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){.mcard:hover{background:rgba(255,255,255,.05)}.mcard:hover .cplay{opacity:1;transform:none}}

/* tiles (recently played) */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 18px}
.tile{display:flex;align-items:center;gap:12px;padding:7px 10px 7px 7px;border-radius:12px;text-align:left;min-width:0;transition:background-color 140ms ease,transform 150ms var(--eo)}
.tile:active{transform:scale(.98)}
.tile .ta{width:44px;height:44px;border-radius:9px;overflow:hidden;flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1px;background:#0d0c10}
.tile .ta img{width:100%;height:100%;object-fit:cover}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tx span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tp{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.08);opacity:0;transform:scale(.7);transition:opacity 150ms ease,transform 170ms var(--eo),color 120ms ease;flex:none}
.tile .tp .ic{width:16px;height:16px}
@media (hover:hover) and (pointer:fine){.tile:hover{background:rgba(255,255,255,.07)}.tile:hover .tp{opacity:1;transform:none;color:#fff}}

/* genre tiles */
.genres{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.gt{position:relative;height:96px;border-radius:14px;overflow:hidden;text-align:left;padding:12px 14px;isolation:isolate;
  background:color-mix(in srgb,var(--gc) 34%,#101014);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);transition:transform 160ms var(--eo)}
.gt:active{transform:scale(.97)}
.gt b{position:relative;z-index:1;font-size:15px;font-weight:800;letter-spacing:-.015em}
.gt span{position:relative;z-index:1;display:block;font-size:11.5px;color:var(--t2);font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 84px)}
.gt img{position:absolute;right:-14px;bottom:-18px;width:84px;height:84px;object-fit:cover;border-radius:8px;transform:rotate(14deg);box-shadow:0 8px 24px -8px rgba(0,0,0,.6)}
.gt img.crop{scale:1.24}
@media (hover:hover) and (pointer:fine){.gt:hover{transform:scale(1.02)}}

/* radio */
.stn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.st{position:relative;text-align:left;border-radius:18px;overflow:hidden;padding:0;isolation:isolate;transition:transform 180ms var(--eo)}
.stn .st:active{transform:scale(.97)}
.st .sa{position:relative;aspect-ratio:16/10;overflow:hidden}
.st .sa img{width:100%;height:100%;object-fit:cover}
.st .sa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(6,6,9,.72))}
.st .sbad{position:absolute;left:10px;top:10px;z-index:1;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:7px;
  font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:rgba(9,8,11,.55);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.st .sbad.live i{width:6px;height:6px;border-radius:50%;background:#ff5a5a;box-shadow:0 0 8px #ff5a5a}
.st .sx{position:absolute;left:12px;right:56px;bottom:10px;z-index:1}
.st .sx b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.st .sx span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600;margin-top:3px}
.st .sp2{position:absolute;right:12px;bottom:12px;z-index:1;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.94);color:#0c0b0f;box-shadow:0 6px 18px -4px rgba(0,0,0,.6);transition:transform 160ms var(--eo)}
.st .sp2 .ic{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){.st:hover .sp2{transform:scale(1.08)}}

/* track table */
.tl{margin-top:8px}
.tl-h,.tr{display:grid;grid-template-columns:40px minmax(0,1.5fr) 118px 34px 46px 34px;align-items:center;gap:10px}
.tl.wide .tl-h,.tl.wide .tr{grid-template-columns:40px minmax(0,1.5fr) minmax(0,.9fr) 118px 34px 46px 34px}
.tl-h{height:32px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--t3);border-bottom:1px solid var(--hair);padding:0 10px}
.tr{height:52px;padding:0 10px;border-radius:10px;transition:background-color 130ms ease}
.tr .tn{color:var(--t3);font-size:12.5px;text-align:center;position:relative}
.tr .tn .eq{display:none}
.tr.playing .tn .num{display:none}
.tr.playing .tn .eq{display:inline-flex}
.tr .tt{display:flex;align-items:center;gap:12px;min-width:0}
.tr .tt .ta{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:none}
.tr .tt .ta img{width:100%;height:100%;object-fit:cover}
.tr .tt b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.008em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr.playing .tt b{color:var(--accent)}
.tr .tt small{display:block;font-size:11.5px;color:var(--t3);font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .talb,.tr .ts,.tr .tf{font-size:12.5px;color:var(--t3);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .ts{display:flex;align-items:center;gap:7px}
.tr .ts .sdot{width:6px;height:6px}
.tr .tf .fmtx{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.02em;white-space:nowrap}
.tr .tf .fmt{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.04em;
  background:rgba(255,255,255,.07);color:var(--t2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);white-space:nowrap}
.tr .tf .fmt.hi{color:#0d0c10;background:color-mix(in srgb,var(--accent) 88%,#fff);box-shadow:none}
.tr .td{font-size:12.5px;color:var(--t3);text-align:right}
.tr .heart{opacity:0;width:32px;height:32px}
.tr .heart.on{opacity:1;color:var(--accent)}
.tr .heart.on .ic{fill:var(--accent)}
.tr .more{opacity:0;width:32px;height:32px}
.tr:hover .heart,.tr:hover .more,.tr:focus-within .heart,.tr:focus-within .more{opacity:1}
.tr:hover .heart{transition:opacity 130ms ease}
@media (hover:hover) and (pointer:fine){.tr:hover{background:rgba(255,255,255,.06)}}
@media (max-width:1360px){.tl-h,.tr{grid-template-columns:36px minmax(0,1.5fr) 104px 32px 46px 32px;gap:8px}.tl.wide .tl-h,.tl.wide .tr{grid-template-columns:36px minmax(0,1.5fr) minmax(0,.7fr) 104px 32px 46px 32px}}

.eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eq i{width:2.5px;border-radius:1px;background:var(--accent);height:35%;animation:eqb 1s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.22s}.eq i:nth-child(3){animation-delay:.44s}
.paused .eq i{animation-play-state:paused;height:20%!important}
@keyframes eqb{from{height:22%}to{height:100%}}

/* album / list header */
.ah{position:relative;display:flex;align-items:flex-end;gap:28px;padding:96px 0 26px;margin:-76px -36px 26px;padding-left:36px;padding-right:36px;overflow:hidden}
.ah-bg{position:absolute;inset:0;z-index:-1;opacity:.9;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 62%,transparent) 0,color-mix(in srgb,var(--tint) 30%,transparent) 52%,rgba(7,7,10,0) 96%);}
.ah-art{width:200px;height:200px;border-radius:14px;overflow:hidden;flex:none;background:#141318;
  box-shadow:0 1px 2px rgba(0,0,0,.35),0 24px 60px -16px rgba(0,0,0,.6)}
.ah-art img{width:100%;height:100%;object-fit:cover}
.ah-art.mosaic{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1px;background:#0d0c10}
.ah-info{min-width:0;flex:1}
.ah-info h1{font-size:40px;font-weight:800;letter-spacing:-.034em;line-height:1.02;margin-top:10px}
.ah-by{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:14.5px;font-weight:600}
.ah-by .lnk{color:var(--t2);border-radius:6px;padding:1px 3px;margin:-1px -3px}
.ah-by .dot{color:var(--t4)}
.ah-by .y{color:var(--t3);font-weight:500}
.ah-desc{margin-top:8px;font-size:13px;color:var(--t2);font-weight:500;max-width:520px;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.05em;
  color:var(--t2);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);white-space:nowrap}
.chip .sdot{width:6px;height:6px}
.chip.hi{color:color-mix(in srgb,var(--accent) 82%,#fff);background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent)}
.ah-act{display:flex;align-items:center;gap:10px;margin-top:22px}
.btn-play{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 22px 0 18px;border-radius:12px;font-size:14px;font-weight:700;letter-spacing:-.01em;
  color:var(--on-accent);background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 26px -10px color-mix(in srgb,var(--accent) 65%,transparent),0 2px 6px rgba(0,0,0,.3);
  transition:transform 150ms var(--eo),filter 140ms ease}
.btn-play:active{transform:scale(.96)}
.btn-play .ic{width:17px;height:17px}
@media (hover:hover) and (pointer:fine){.btn-play:hover{filter:brightness(1.06)}}
.rnd{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--t2);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);transition:transform 150ms var(--eo),background-color 130ms ease,color 130ms ease}
.rnd:active{transform:scale(.96)}
.rnd .ic{width:19px;height:19px}
.rnd.on{color:var(--accent)}
@media (hover:hover) and (pointer:fine){.rnd:hover{background:rgba(255,255,255,.13);color:#fff}}
.ah-foot{margin-top:22px;padding-bottom:26px;font-size:12px;color:var(--t3);font-weight:500}
@media (max-width:1360px){.ah-art{width:172px;height:172px}.ah-info h1{font-size:34px}}

/* local source strip */
.lcl{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.lcl .ic{color:var(--t3)}
.lcl .lx{flex:1;min-width:0}
.lcl .lx b{display:block;font-size:13.5px;font-weight:700}
.lcl .lx span{display:block;font-size:12px;color:var(--t3);margin-top:2px}
.lcl .chips{margin:0}

/* ================= player pill ================= */
#player{position:fixed;left:calc(50% + var(--sbw)/2);bottom:14px;z-index:7;width:min(1040px,calc(100vw - var(--sbw) - 96px));height:66px;padding:9px;border-radius:20px;
  display:flex;align-items:center;gap:6px;transform:translateX(-50%);
  background:var(--glass-strong);backdrop-filter:blur(44px) saturate(1.7);-webkit-backdrop-filter:blur(44px) saturate(1.7);box-shadow:var(--elev);
  transition:transform 320ms var(--spring),opacity 200ms var(--eo)}
.np-open #player{transform:translateX(-50%) translateY(16px) scale(.985);opacity:0;pointer-events:none;transition:transform 200ms var(--eo),opacity 160ms ease}
#pArt{position:relative;width:48px;height:48px;border-radius:12px;overflow:hidden;flex:none;background:#141318;box-shadow:0 2px 10px rgba(0,0,0,.4)}
#pArt img{width:100%;height:100%;object-fit:cover}
.p-info{width:172px;min-width:0;padding:0 8px 0 12px;flex:none}
.p-info button{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:5px}
.p-info .pt{font-size:13.5px;font-weight:700;letter-spacing:-.012em;color:#fff}
.p-info .ps{font-size:11.5px;font-weight:500;color:var(--t3);margin-top:2px;display:flex;align-items:center;gap:6px}
.p-info .ps .sdot{width:6px;height:6px}
.p-love{margin-right:2px}
.p-ctrl{display:flex;align-items:center;gap:1px;flex:none}
#playBtn{width:40px;height:40px;border-radius:50%;background:#fff;color:#0b0b0e;margin:0 6px;display:grid;place-items:center;position:relative;flex:none;
  box-shadow:0 1px 2px rgba(0,0,0,.28),0 8px 20px -8px rgba(0,0,0,.6);transition:transform 150ms var(--eo)}
#playBtn:active{transform:scale(.96)}
#playBtn .ic{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;transition:opacity 280ms var(--icon),transform 280ms var(--icon),filter 280ms var(--icon)}
.ic-swap .ic.off{opacity:0;transform:scale(.25);filter:blur(4px)}
.instant .ic,.instant *{transition:none!important}
.p-seek{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:11.5px;font-weight:600;color:var(--t3)}
.p-seek .tnum{width:36px;flex:none;font-variant-numeric:tabular-nums}
.p-seek .tnum:last-child{text-align:left}
.p-seek .tnum:first-child{text-align:right}
.slider{position:relative;flex:1;height:36px;display:flex;align-items:center;cursor:pointer;touch-action:none;min-width:40px}
.slider .trk{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden}
.slider .fill{position:absolute;inset:0;background:rgba(255,255,255,.9);transform-origin:0 50%;transform:scaleX(0)}
.slider .thumb{position:absolute;left:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45);
  opacity:0;scale:.5;transition:opacity 120ms ease,scale 150ms var(--eo)}
.slider.drag .thumb{opacity:1;scale:1}
.slider.drag .fill{background:var(--accent)}
@media (hover:hover) and (pointer:fine){.slider:hover .thumb{opacity:1;scale:1}}
.p-vol{display:flex;align-items:center;gap:2px;width:128px;flex:none;padding-right:4px}
.p-vol .ib{width:32px;height:32px}
.p-vol .ic{width:18px;height:18px}
#volIc .w1,#volIc .w2,#volIc .mx{transition:opacity 140ms ease}
#volIc.m .w1,#volIc.m .w2{opacity:0}
#volIc:not(.m) .mx{opacity:0}
#volIc.lo .w2{opacity:0}
.p-end{display:flex;align-items:center;gap:1px;flex:none}
.psep{width:1px;height:22px;background:rgba(255,255,255,.1);margin:0 5px;flex:none}

/* ================= queue drawer ================= */
#queue{position:fixed;right:12px;top:12px;bottom:92px;width:344px;z-index:8;border-radius:20px;padding:8px;display:flex;flex-direction:column;
  background:var(--glass-strong);backdrop-filter:blur(44px) saturate(1.6);-webkit-backdrop-filter:blur(44px) saturate(1.6);box-shadow:var(--elev);
  transform:translateX(calc(100% + 24px));transition:transform 420ms var(--spring);visibility:hidden}
#queue.open{transform:none;visibility:visible}
.q-h{display:flex;align-items:center;height:44px;padding:0 6px 0 14px;flex:none}
.q-h h3{font-size:15px;font-weight:750;letter-spacing:-.015em;flex:1}
.q-h .lnk{font-size:12px;font-weight:600;color:var(--t3);border-radius:6px;padding:4px 6px}
@media (hover:hover) and (pointer:fine){.q-h .lnk:hover{color:#fff}}
.q-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;margin:0 -4px;padding:0 4px 92px;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 36px),transparent 100%);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 36px),transparent 100%)}
.q-list::-webkit-scrollbar{display:none}
.q-lbl{display:flex;align-items:baseline;height:30px;padding:0 12px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.q-lbl span:last-child{margin-left:auto;letter-spacing:.02em;text-transform:none;font-weight:600}
.qr{position:relative;display:flex;align-items:center;gap:10px;height:50px;padding:0 8px;border-radius:11px;transition:background-color 130ms ease,opacity 130ms ease;touch-action:none}
.qr .grip{color:var(--t4);flex:none;cursor:grab}
.qr .grip .ic{width:15px;height:15px}
.qr .qa{width:34px;height:34px;border-radius:8px;overflow:hidden;flex:none}
.qr .qa img{width:100%;height:100%;object-fit:cover}
.qr .qx{flex:1;min-width:0}
.qr .qx b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .qx small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .qx small .sdot{width:5px;height:5px;box-shadow:none}
.qr .qd{font-size:11.5px;color:var(--t3)}
.qr .rm{opacity:0;width:28px;height:28px}
.qr .rm .ic{width:14px;height:14px}
.qr:hover .rm{opacity:1}
.qr.now{background:rgba(255,255,255,.07)}
.qr.now .qx b{color:var(--accent)}
.qr.now .eq{margin-left:2px}
.qr.dragging{z-index:2;background:rgba(30,29,36,.96);box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
.dragging-q .qr{transition:transform 180ms var(--eo)}
@media (hover:hover) and (pointer:fine){.qr:hover{background:rgba(255,255,255,.06)}}
.q-empty{padding:22px 14px;font-size:12.5px;color:var(--t3);font-weight:500;text-align:center;line-height:1.55}

/* ================= now playing ================= */
#np{position:fixed;inset:0;z-index:9;visibility:hidden;transform:translateY(6%);opacity:0;--nsize:clamp(300px,47vh,440px);
  transition:transform 460ms var(--spring),opacity 240ms var(--eo),visibility 0s 460ms}
#np.open{visibility:visible;transform:none;opacity:1;transition:transform 460ms var(--spring),opacity 200ms var(--eo),visibility 0s}
.np-top{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;padding:0 18px;z-index:3}
.np-top .cr{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:8px}
.np-tools{margin-left:auto;display:flex;gap:2px}
#npStage{position:absolute;inset:0}
#artWrap{position:absolute;left:max(56px,7vw);top:calc(50% - var(--nsize)/2 - 34px);width:var(--nsize);height:var(--nsize);
  transform-origin:0 0;transition:transform 380ms var(--io),width 380ms var(--io),height 380ms var(--io),top 380ms var(--io);cursor:pointer;border-radius:16px}
#artWrap.snap,.snap{transition:none!important}
#artWrap.flying{opacity:0}
.art{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;background:#131217;
  box-shadow:0 1px 2px rgba(0,0,0,.4),0 24px 48px -14px rgba(0,0,0,.6),0 60px 130px -36px rgba(0,0,0,.7);transition:transform 240ms var(--eo)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity 280ms var(--eo),transform 280ms var(--eo)}
.art img.front{opacity:1;transform:none}
.art-hint{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 6px;border-radius:9px;
  background:rgba(10,9,12,.55);backdrop-filter:blur(16px);font-size:11.5px;font-weight:700;color:var(--t1);opacity:0;transform:translateY(4px);
  transition:opacity 150ms var(--eo),transform 150ms var(--eo);pointer-events:none}
@media (hover:hover) and (pointer:fine){
  #artWrap:hover .art{transform:scale(1.008)}
  #artWrap:hover .art-hint{opacity:1;transform:none}

}
#meta{position:absolute;left:calc(max(56px,7vw) + var(--nsize) + 64px);right:max(48px,6vw);top:calc(50% - 30px);transform:translateY(-50%);
  transition:opacity 220ms var(--eo),transform 220ms var(--eo)}

#mTitle{font-size:clamp(48px,5.6vw,84px);font-weight:800;letter-spacing:-.042em;line-height:.96;margin:16px 0 16px -.03em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-bottom:.05em}

.m-sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-size:19px;font-weight:600}
.m-sub .lnk{border-radius:6px}
.m-sub .alb{color:var(--t2);font-weight:500}
.msep{color:var(--t4);font-weight:600}

#mChips{margin-top:20px}
.m-line{margin-top:34px;display:flex;align-items:center;gap:12px;max-width:540px;min-height:36px;color:var(--t2);font-size:15.5px;font-weight:600}
.m-line .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity 180ms ease}
.m-line .kbd{flex:none}
.m-clock{margin-top:24px;display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:600;color:var(--t3)}
.m-clock b{font-size:28px;font-weight:750;color:var(--t1);letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.m-clock .num{font-variant-numeric:tabular-nums}
#lyrMini{position:absolute;left:calc(max(56px,7vw) + 80px);top:88px;opacity:0;transform:translateX(-8px);transition:opacity 150ms ease,transform 150ms var(--eo);pointer-events:none;max-width:300px}
.lyr-on #lyrMini{opacity:1;transform:none;transition-duration:220ms;transition-delay:70ms}
#lyrMini b{display:block;font-size:15px;font-weight:750;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lyrMini span{display:block;font-size:13px;color:var(--t2);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lyrWrap{position:absolute;left:0;right:0;top:104px;bottom:120px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity 150ms ease;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 20%,#000 74%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 20%,#000 74%,transparent 100%)}

.l{font-size:clamp(34px,3.8vw,54px);font-weight:800;line-height:1.12;letter-spacing:-.03em;text-align:center;padding:15px 0;border-radius:16px;
  opacity:.4;transform:scale(.94);transition:opacity 280ms var(--eo),transform 280ms var(--eo);cursor:pointer;text-wrap:balance}
.l.past{opacity:.26}
.l.cur{opacity:1;transform:none}

/* np transport */
#npBar{position:absolute;left:calc(max(56px,7vw) + var(--nsize) + 64px);right:max(48px,6vw);bottom:0;height:120px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;z-index:3}

.np-row{width:min(640px,100%);display:flex;align-items:center;margin-top:8px}

.np-vol{display:flex;align-items:center;gap:2px;width:128px}
.np-vol .slider{height:30px}

/* ================= palette ================= */
#pal{position:fixed;inset:0;z-index:20;display:none}
#pal.open{display:block}
.pal-bg{position:absolute;inset:0;background:rgba(6,6,9,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity 120ms ease}

  background:var(--glass-strong);backdrop-filter:blur(48px) saturate(1.6);-webkit-backdrop-filter:blur(48px) saturate(1.6);box-shadow:var(--elev),0 60px 160px -30px rgba(0,0,0,.7)}
.pal-in{display:flex;align-items:center;gap:11px;height:54px;padding:0 14px 0 16px;border-bottom:1px solid var(--hair)}
.pal-in .ic{width:18px;height:18px;color:var(--t3)}

.pal-in input::placeholder{color:var(--t3)}
.pal-list{max-height:min(420px,52vh);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:6px}
.pal-list::-webkit-scrollbar{display:none}
.pg{padding:10px 10px 6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.pi{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:11px;cursor:pointer}
.pi .pa{width:34px;height:34px;border-radius:8px;overflow:hidden;flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:1px;place-items:center;background:rgba(255,255,255,.06);color:var(--t3)}

.pi .px{flex:1;min-width:0}

.pi .px b mark{background:none;color:var(--accent);font-weight:750}
.pi .px small{display:block;font-size:11.5px;color:var(--t3);font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .pk{display:flex;gap:4px;flex:none}
.pi .pt{font-size:11.5px;color:var(--t3);flex:none}
.pi.sel{background:rgba(255,255,255,.1)}

.pal-none{padding:26px 16px;text-align:center;font-size:13px;color:var(--t3);font-weight:600}

#switch{position:fixed;z-index:76;min-width:250px;padding:6px;border-radius:16px;

.ctx-h{padding:7px 10px 9px;min-width:0}

.ctx-h small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

let lyLines=[],lyIdx=-2,lyOff=[],lyWords=[];
function buildLyrics(){
 const inner=$('#lyrInner');const L0=LYR[S.cur];lyIdx=-2;
 document.body.classList.toggle('nolyr',!L0);
 if(!L0){inner.innerHTML='';lyLines=[];$('#mLineTxt').textContent='Instrumental · no synced lyrics';return;}

 lyLines=L0.map((l,i)=>{const end=(L0[i+1]?L0[i+1][0]:Math.min(dur,l[0]+8))-.5;const words=l[1].split(' ');const tot=words.reduce((s,w)=>s+w.length+1,0);let acc=0;
  const wt=words.map(w=>{const st=l[0]+(end-l[0])*.92*(acc/tot);acc+=w.length+1;return st;});return {t:l[0],end,text:l[1],words,wt};});
 inner.innerHTML=lyLines.map((l,i)=>'<div class="l'+(l.text==='♪'?' gap':'')+'" data-li="'+i+'">'+(l.text==='♪'?'<svg class="ic" style="width:20px;height:20px;margin:0 auto;opacity:.55"><use href="#i-note"/></svg>':l.words.map(w=>'<span class="w">'+esc(w)+'</span>').join(' '))+'</div>').join('');

 const inner=$('#lyrInner');const box=$('#lyrWrap');
 if(!lyOff.length||lyIdx<0){inner.style.transform='translateY('+(box.clientHeight*.4)+'px)';return;}
 const c=lyOff[lyIdx][0]+lyOff[lyIdx][1]/2;
 inner.style.transform='translateY('+(box.clientHeight*.5-c)+'px)';

function updateLyrics(){
 if(!lyLines.length)return;
 const p=S.pos;let idx=-1;
 for(let i=0;i<lyLines.length;i++){if(lyLines[i].t<=p)idx=i;else break;}
 if(idx!==lyIdx){lyIdx=idx;
  $$('#lyrInner .l').forEach((el,i)=>{el.classList.toggle('cur',i===idx);el.classList.toggle('past',i<idx);});
  lyricsTransform();
  $('#mLineTxt').textContent=idx>=0?lyLines[idx].text:'Instrumental';
 }

let palItems=[],palSel=0,palReturn=null;
function fuzzy(q,s){const sl=s.toLowerCase();let qi=0,score=0,last=-2;const idx=[];
 for(let i=0;i<sl.length&&qi<q.length;i++){if(sl[i]===q[qi]){let sc=1;if(i===last+1)sc+=3;if(i===0||/[\s\-\/(&·]/.test(sl[i-1]))sc+=4;score+=sc;idx.push(i);last=i;qi++;}}
 if(qi<q.length)return null;return {score:score-sl.length*.02-idx[0]*.08,idx};}
function hl(s,idx){if(!idx)return esc(s);let o='';for(let i=0;i<s.length;i++)o+=idx.indexOf(i)>=0?'<mark>'+esc(s[i])+'</mark>':esc(s[i]);return o;}
function palUniverse(){
 const u=[];
 ALBUMS.forEach(a=>u.push({kind:'Albums',label:a.title,sub:'Album · '+a.artist+' · '+a.year+' · '+(a.src==='lo'?LO.name:PF[S.platform].name),img:a,run:()=>openAlbum(a.id)}));
 PLAYLISTS.concat(MADE,STATIONS).filter(p=>!p.src||p.src===S.platform||p.src==='lo').forEach(p=>u.push({kind:'Playlists',label:p.name,sub:(p.kind||'Playlist')+' · '+p.ids.length+' songs'+(p.src==='lo'?' · On this Mac':' · '+PF[p.src||S.platform].name),mos:p.ids,run:()=>openList(p.id)}));
 Object.keys(T).forEach(id=>{const t=T[id];u.push({kind:'Tracks',label:t.title,sub:t.artist+' — '+A[t.album].title+' · '+(t.src==='lo'?LO.short:PF[S.platform].short),img:A[t.album],dur:t.dur,run:()=>{const a=A[t.album];playList(a.ids,a.ids.indexOf(id),a.title);}});});
 ACTIONS.forEach(a=>u.push({kind:'Commands',label:a.label,sub:'',icon:a.icon,keys:a.keys,run:a.run}));
 return u;}
let UNI=palUniverse();
function renderPal(){
 const q=$('#palInput').value.trim().toLowerCase();let res;
 if(!q){res=UNI.filter(x=>x.kind==='Commands').slice(0,5).concat(UNI.filter(x=>x.kind==='Albums'),UNI.filter(x=>x.kind==='Playlists').slice(0,4)).map(x=>({it:x,score:0,idx:null}));}
 else{res=[];UNI.forEach(it=>{const m=fuzzy(q,it.label);const m2=it.sub?fuzzy(q,it.sub):null;let best=null;
   if(m)best={it,score:m.score+(it.kind==='Albums'?2:it.kind==='Playlists'?1.5:it.kind==='Commands'?1:0),idx:m.idx};
   if(m2&&(!best||m2.score*.55>best.score))best={it,score:m2.score*.55,idx:null};if(best)res.push(best);});
  res.sort((x,y)=>y.score-x.score);}
 const groups={};const order=[];res.forEach(r=>{const k=r.it.kind;if(!groups[k]){groups[k]=[];order.push(k);}if(groups[k].length<6)groups[k].push(r);});
 palItems=[];let html='';
 order.forEach(k=>{html+='<div class="pg">'+k+'</div>';groups[k].forEach(r=>{const it=r.it;const i=palItems.length;palItems.push(it);
  const art=it.img?'<span class="pa ring">'+imgTag(it.img)+'</span>':it.mos?'<span class="pa mosaic ring">'+mosaic(it.mos)+'</span>':'<span class="pa icx">'+ic(it.icon,it.icon==='play'||it.icon==='next'||it.icon==='prev')+'</span>';
  const right=it.keys&&it.keys.length?'<span class="pk">'+it.keys.map(k2=>'<span class="kbd">'+k2+'</span>').join('')+'</span>':it.dur?'<span class="pt tnum">'+fmt(it.dur)+'</span>':'';
  html+='<div class="pi" role="option" data-pi="'+i+'">'+art+'<span class="px"><b>'+hl(it.label,r.idx)+'</b>'+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+'</span>'+right+'</div>';});});
 $('#palList').innerHTML=html||'<div class="pal-none">No matches for “'+esc(q)+'”</div>';
 palSel=0;paintSel();
}
function paintSel(){$$('#palList .pi').forEach((el,i)=>{el.classList.toggle('sel',i===palSel);el.setAttribute('aria-selected',i===palSel);});
 const el=$('#palList .pi.sel');if(el){const L2=$('#palList');const t=el.offsetTop,b=t+el.offsetHeight;if(t<L2.scrollTop+6)L2.scrollTop=t-34;else if(b>L2.scrollTop+L2.clientHeight)L2.scrollTop=b-L2.clientHeight+6;}}
function openPalette(){S.palOpen=true;palReturn=document.activeElement;$('#pal').classList.add('open');$('#palInput').value='';renderPal();$('#palInput').focus();closeCtx();}
function closePalette(){S.palOpen=false;$('#pal').classList.remove('open');if(palReturn&&palReturn.focus)palReturn.focus({preventScroll:true});}
function runPal(i){const it=palItems[i];if(!it)return;closePalette();it.run();}
$('#palInput').addEventListener('input',renderPal);
$('#palInput').addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'){e.preventDefault();if(palItems.length){palSel=(palSel+1)%palItems.length;paintSel();}}
 else if(e.key==='ArrowUp'){e.preventDefault();if(palItems.length){palSel=(palSel-1+palItems.length)%palItems.length;paintSel();}}
 else if(e.key==='Enter'){e.preventDefault();runPal(palSel);}
 else if(e.key==='Escape'){e.preventDefault();closePalette();}
 else if(e.key==='Tab'){e.preventDefault();}
});
$('#palList').addEventListener('pointermove',e=>{const el=e.target.closest('.pi');if(!el)return;const i=+el.dataset.pi;if(i!==palSel){palSel=i;$$('#palList .pi').forEach((x,j)=>x.classList.toggle('sel',j===i));}});

  playList(ids,Math.max(0,ids.indexOf(tid)),label);return;}
 const am=e.target.closest('[data-album-more]');
 if(am){const r=am.getBoundingClientRect();openCtx(r.left-60,r.bottom+8,{aid:am.dataset.albumMore});return;}
});

/* ================= PLATFORM SWITCHER ================= */
function openSwitch(){
 const m=$('#switch');const acct=$('#acct').getBoundingClientRect();
 const rows=Object.keys(PF).map(k=>{const s=PF[k];const on=S.platform===k;
  return '<button class="ci pf-row" data-pf="'+k+'" role="menuitem"><i class="svc" style="--c:'+s.color+'">'+ic(PFG[k])+'</i><span class="pfx"><b>'+esc(s.name)+'</b><small>'+esc(s.status==='off'?'Not connected':s.acct)+'</small></span>'+
   (on?'<span class="sw-on">'+ic('check')+'</span>':s.status==='off'?'<span class="sw-ct">Connect</span>':s.status==='sync'?'<span class="sw-ct sy">Syncing</span>':'<span class="sw-ct">Switch</span>')+'</button>';}).join('');
 m.innerHTML='<div class="ctx-h"><b>Platform</b><small>Cadence acts as a client for one service</small></div><div class="ctx-sep"></div>'+rows+
  '<div class="ctx-sep"></div><button class="ci pf-row" data-nav="src:lo" role="menuitem"><i class="svc" style="--c:'+LO.color+'">'+ic('folder')+'</i><span class="pfx"><b>On this Mac</b><small>'+esc(LO.acct)+' · always available</small></span><span class="sw-ct">Open</span></button>';
 m.style.left=acct.left+'px';m.style.top=(acct.bottom+8)+'px';m.style.width=Math.max(272,acct.width)+'px';m.style.transformOrigin='16px 0';
 m.classList.add('open');S.swOpen=true;pushLayer('switch');closeCtx();}
function closeSwitch(){if(!S.swOpen)return;S.swOpen=false;$('#switch').classList.remove('open');popLayer('switch');}
$('#switch').addEventListener('click',e=>{
 const pf=e.target.closest('[data-pf]');if(pf){setPlatform(pf.dataset.pf);closeSwitch();return;}
 const nv=e.target.closest('[data-nav]');if(nv){go(nv.dataset.nav);closeSwitch();}});
document.addEventListener('pointerdown',e=>{if(S.swOpen&&!e.target.closest('#switch,#acct'))closeSwitch();},true);
function setPlatform(k,instant){
 if(k===S.platform&&PF[k].status==='ok'){hud(ic('check')+esc(PF[k].name)+' is active');return;}
 const apply=()=>{PF[k].status='ok';S.platform=k;paintSources();paintAcct();paintPl();
  UNI=palUniverse();
  const ok=id=>{const a=A[T[id].album];return a&&(a.src==='lo'||!a.lib||a.lib.includes(k));};
  S.queue=S.queue.filter(ok);S.history=S.history.filter(ok);
  const ca=A[T[S.cur].album];if(ca&&ca.src==='st'&&ca.lib&&!ca.lib.includes(k)){const na=pfAlbs()[0];if(na){S.queue=na.ids.slice(1);S.ctxList={label:na.title,ids:na.ids.slice()};setTrack(na.ids[0]);}}
  $('#scroller').classList.add('swap');
  setTimeout(()=>{renderView();$('#scroller').classList.remove('swap');},instant?0:150);
  renderMeta();renderQueue();hud(ic('check')+'Switched to '+esc(PF[k].name));};
 if(PF[k].status!=='ok'&&!instant){PF[k].status='sync';paintSources();hud('Connecting to '+esc(PF[k].name)+'…');
  setTimeout(apply,700);}else apply();
}
function paintAcct(){$('#acct .at span').textContent=PF[S.platform].name;}

/* ================= KEYBOARD ================= */
function escape(){
 const top=S.stack[S.stack.length-1];
 if(top==='ctx')return closeCtx();
 if(top==='switch')return closeSwitch();
 if(top==='pal')return closePalette();
 if(top==='queue')return setQueue(false);
 if(top==='np')return setNP(false);
 navBack();
}
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target&&e.target.matches('[data-open-album],[data-open-list],[data-nav],[data-pf]')){e.preventDefault();e.target.click();return;}
 const k=e.key,mod=e.metaKey||e.ctrlKey;
 if(mod&&(k==='k'||k==='K')){e.preventDefault();S.palOpen?closePalette():openPalette();return;}
 if(S.palOpen)return;
 if(e.target.matches&&e.target.matches('input,textarea'))return;
 if(k==='Escape'){e.preventDefault();escape();return;}
 if(mod||e.altKey)return;
 if(k===' '){e.preventDefault();setPlaying(!S.playing,true);hud(ic(S.playing?'play':'pause',1)+(S.playing?'Playing':'Paused'));}
 else if(k==='ArrowRight'||k==='ArrowLeft'){
  const d=k==='ArrowRight'?1:-1;e.preventDefault();
  if(e.shiftKey){d>0?next(true):prev(true);hud(ic(d>0?'next':'prev',1)+esc(T[S.cur].title));}
  else{seekTo(S.pos+d*5);paintProgress();hud((d>0?'+5s':'−5s')+' <span class="tnum">'+fmt(S.pos)+' / '+fmt(T[S.cur].dur)+'</span>');}
 }
 else if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();setVol((S.muted?0:S.vol)+(k==='ArrowUp'?.05:-.05));hud('Volume <span class="tnum">'+Math.round((S.muted?0:S.vol)*100)+'%</span>');}
 else if(k==='l'||k==='L'){setLyrics(!S.lyrics,true);}
 else if(k==='q'||k==='Q'){setQueue(!S.queueOpen);}
 else if(k==='n'||k==='N'){setNP(!S.np,true);}
 else if(k==='1')go('home');else if(k==='2')go('browse');else if(k==='3')go('radio');
});

/* ================= LOOP ================= */
let lastT=performance.now();
function loop(now){
 const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
 if(S.playing&&!S.drag){S.pos+=dt;if(S.pos>=T[S.cur].dur)next(false,true);}
 paintProgress();updateLyrics();
 if(GL){gt+=RM.matches?dt*.15:dt;GL.draw(gt,easeMix(performance.now()),palFrom,palTo);}
 requestAnimationFrame(loop);
}
addEventListener('load',()=>{measure();});

 if(qs.get('probe'))setTimeout(()=>{const r=e=>{const b=e.getBoundingClientRect();return Math.round(b.left)+','+Math.round(b.top)+' '+Math.round(b.width)+'x'+Math.round(b.height);};
  document.title='art='+r($('#artWrap'))+' meta='+r($('#meta'))+' nsize='+getComputedStyle($('#artWrap')).getPropertyValue('--nsize')
   +' ma='+(function(){const g=document.querySelector('.mcard .ma');const i=g.querySelector('img');const cs=getComputedStyle(i);return g.getBoundingClientRect().width+'/'+i.getBoundingClientRect().width+' scale:'+cs.scale+' of:'+cs.objectFit+' cls:'+i.className+' gap:'+getComputedStyle(g).gap})();},900);
 if(parts.includes('np'))setNP(true,true);
 if(parts.includes('lyrics'))setLyrics(true,true);
 if(parts.includes('queue'))setQueue(true);
 if(parts.includes('pal'))openPalette();
 if(parts.includes('ctx'))setTimeout(()=>{const tt=document.querySelector('[data-open-album="monsoon"]');const b=tt?tt.getBoundingClientRect():{left:innerWidth*.5,top:innerHeight*.42,width:0,height:0};openCtx(b.left+Math.min(b.width*.55,320),b.top+Math.min(b.height*.7,120),{aid:'monsoon'});},50);
}
requestAnimationFrame(()=>{measure();requestAnimationFrame(loop);});
ALBUMS.forEach(a=>sampleCover(a));
})();
