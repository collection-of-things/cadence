    MaxGen = 5
    MaxSteps = 18
    MaxStarts = 2
    PrefetchGuarded = TRUE
    AdvanceGuarded = FALSE
SPECIFICATION Spec
INVARIANT SingleAudible
INVARIANT StopBeforePlay
INVARIANT PrepareFailRollback
INVARIANT PendingPrefetchSound
INVARIANT NoStaleAdvance
INVARIANT AdoptedWhenEligible
INVARIANT PlayingLeaseSound
PROPERTY StartCompletes
PROPERTY AdvanceTerminates
