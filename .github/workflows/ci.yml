name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg libasound2-dev pkg-config
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm -r typecheck
      - name: build
        run: pnpm -r build
      - name: unit tests
        run: pnpm -r test
      - name: tla+ model checks
        run: node apps/desktop/scripts/check-specs.mjs
      - name: tla+ mutation checks
        run: node apps/desktop/scripts/check-specs.mjs --mutants
      - name: audio service build + test
        run: |
          cargo build --manifest-path services/audio/Cargo.toml
          cargo test --manifest-path services/audio/Cargo.toml
      - name: headless playback probe
        run: |
          bash scripts/gen-fixtures.sh
          bash scripts/probe-audio.sh
